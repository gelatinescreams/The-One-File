name: Attach TheOneFile to releases

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the files to
        required: true

permissions:
  contents: write

jobs:
  attach:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check both files are there
        run: |
          for f in the-one-file.html theonefile-networkening.html; do
            test -s "$f" || { echo "$f is missing or empty"; exit 1; }
          done

      - name: Attach to the release
        run: gh release upload "$TAG" the-one-file.html theonefile-networkening.html --clobber --repo "$GITHUB_REPOSITORY"
